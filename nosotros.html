<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nosotros — Feliz Cumpleaños</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg-decorations">
    <img class="deco-img sutil flota" style="top:4%; left:2%; width:16%; max-width:110px;" src="assets/deco/ionic_column.png" alt="" />
    <img class="deco-img sutil flota-lenta" style="top:18%; right:2%; width:18%; max-width:130px;" src="assets/deco/laurel_wreath_big.png" alt="" />
    <img class="deco-img sutil flota" style="top:46%; left:2%; width:15%; max-width:100px;" src="assets/deco/hermes_lyre.png" alt="" />
    <img class="deco-img sutil flota-lenta" style="top:62%; right:3%; width:14%; max-width:95px;" src="assets/deco/crossed_arrows.png" alt="" />
    <img class="deco-img sutil flota" style="bottom:4%; left:4%; width:13%; max-width:90px;" src="assets/deco/owl_pedestal_2.png" alt="" />
  </div>

  <header class="page-header">
    <a href="index.html" class="volver">← Volver</a>
    <h1>Nosotros</h1>
    <p>Dos historias que decidieron convertirse en una sola. Este es un pequeño altar a todo lo que hemos construido juntos, instante a instante.</p>
  </header>

  <main>
    <div class="page-hero-img">
      <img src="img/nosotros-principal.jpg" alt="Nosotros" />
    </div>

    <div class="carrusel">
      <button class="flecha-circular flecha-circular--izq" aria-label="Imagen anterior">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
      </button>

      <div class="carrusel-track">
        <div class="carrusel-slide activa" data-caption="El primer día que nos vimos.">
          <img src="img/nosotros-1.jpg" alt="Recuerdo 1" />
        </div>
        <div class="carrusel-slide" data-caption="Aquella tarde que se hizo eterna.">
          <img src="img/nosotros-2.jpg" alt="Recuerdo 2" />
        </div>
        <div class="carrusel-slide" data-caption="Riéndonos de todo y de nada.">
          <img src="img/nosotros-3.jpg" alt="Recuerdo 3" />
        </div>
        <div class="carrusel-slide" data-caption="Y aquí seguimos, eligiéndonos.">
          <img src="img/nosotros-4.jpg" alt="Recuerdo 4" />
        </div>
      </div>

      <button class="flecha-circular flecha-circular--der" aria-label="Imagen siguiente">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" /></svg>
      </button>

      <p class="carrusel-caption"></p>
    </div>

    <p class="footer-firma">— con todo mi cariño —</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
