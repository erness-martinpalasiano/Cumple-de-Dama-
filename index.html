<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Feliz Cumpleaños</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Ícono decorativo reutilizado por la diapositiva de cierre del carrusel destacado -->
  <svg style="display:none" aria-hidden="true">
    <defs>
      <symbol id="icon-destacada-cierre" viewBox="0 0 100 100">
        <path d="M50 82 C20 62 8 44 8 28 C8 14 19 5 31 5 C40 5 47 10 50 18 C53 10 60 5 69 5 C81 5 92 14 92 28 C92 44 80 62 50 82 Z"
              fill="none" stroke="#f2ece0" stroke-width="3.2" stroke-linejoin="round" />
        <path d="M50 14 L52 20 L58 21 L53 25 L55 31 L50 27.5 L45 31 L47 25 L42 21 L48 20 Z" fill="#c6a15b" />
      </symbol>
    </defs>
  </svg>

  <!-- ============================================================
       PORTADA / HERO
  ============================================================ -->
  <header class="hero" id="hero">

    <!-- Decoraciones griegas doradas -->
    <div class="bg-decorations">
      <img class="deco-img flota" style="top:9%; left:3%; width:12%; max-width:80px; --rot:-2deg;" src="assets/deco/ionic_column.png" alt="" />
      <img class="deco-img flota-lenta" style="top:9%; right:3%; width:12%; max-width:80px; --rot:2deg; transform:scaleX(-1);" src="assets/deco/ionic_column.png" alt="" />
      <img class="deco-img sutil flota" style="top:40%; left:2%; width:18%; max-width:130px;" src="assets/deco/bust_female_laurel.png" alt="" />
      <img class="deco-img sutil flota-lenta" style="top:40%; right:2%; width:16%; max-width:118px;" src="assets/deco/bust_male_laurel.png" alt="" />
      <img class="deco-img flota" style="top:78%; right:5%; width:11%; max-width:78px;" src="assets/deco/helmet_gold.png" alt="" />
      <img class="deco-img sutil flota-lenta" style="top:78%; left:5%; width:10%; max-width:74px;" src="assets/deco/lyre_berries.png" alt="" />
      <span class="estrella" style="top:22%; left:10%;">✦</span>
      <span class="estrella" style="top:62%; right:12%; animation-delay:1.2s;">✧</span>
      <span class="estrella" style="top:22%; right:10%; animation-delay:2.1s;">✦</span>
    </div>

    <!-- Franja cereza ondulada con patrón de cerezas/frutillas + línea dorada -->
    <div class="hero-band" aria-hidden="true">
      <svg viewBox="0 0 1440 260" preserveAspectRatio="none">
        <defs>
          <pattern id="patronFrutas" patternUnits="userSpaceOnUse" width="340" height="170" x="0" y="0">
            <image href="assets/fruit-pattern.jpg" x="0" y="0" width="340" height="170" preserveAspectRatio="xMidYMid slice" />
          </pattern>
        </defs>
        <path class="patron" fill="url(#patronFrutas)" d="M0,0 L1440,0 L1440,150
          C1330,205 1250,120 1130,148
          C1010,176 950,225 830,190
          C710,155 660,120 540,150
          C420,180 360,215 240,182
          C150,158 90,128 0,158 Z" />
        <path class="linea-oro" d="M1440,150
          C1330,205 1250,120 1130,148
          C1010,176 950,225 830,190
          C710,155 660,120 540,150
          C420,180 360,215 240,182
          C150,158 90,128 0,158" />
      </svg>
    </div>

    <div class="hero-content">
      <h1 class="hero-title">Feliz<br />Cumpleaños</h1>

      <div class="ornamento-divisor"><span></span><span class="rombo"></span><span></span></div>

      <button class="unlock-btn" id="unlockBtn" type="button">
        <span class="etiqueta">Desbloquear recuerdos</span>
        <span class="circulo">
          <svg viewBox="0 0 24 24"><path d="M12 4v14M6 13l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>
    </div>
  </header>

  <!-- ============================================================
       SECCIÓN DE RECUERDOS
  ============================================================ -->
  <section class="memories" id="memories">
    <button class="back-btn" id="backBtn" type="button">← Volver</button>

    <div class="recuerdos-card">

      <div class="bg-decorations">
        <img class="deco-img sutil" style="top:2%; left:1%; width:18%; max-width:120px;" src="assets/deco/laurel_open_branches.png" alt="" />
        <img class="deco-img sutil" style="top:2%; right:1%; width:18%; max-width:120px; transform:scaleX(-1);" src="assets/deco/laurel_open_branches.png" alt="" />
        <img class="deco-img sutil flota-lenta" style="bottom:6%; left:1%; width:14%; max-width:100px;" src="assets/deco/owl_pedestal_1.png" alt="" />
        <img class="deco-img sutil flota-lenta" style="bottom:4%; right:1%; width:13%; max-width:95px;" src="assets/deco/temple_2.png" alt="" />
      </div>

      <h2 class="memories-title">Recuerdos</h2>

      <div class="cards-grid">

        <!-- Tarjeta 1 -->
        <a class="memory-card" href="nosotros.html">
          <p class="memory-card__titulo">
            <svg viewBox="0 0 24 24"><path d="M3 12c4-8 14-8 18 0" stroke-linecap="round"/></svg>
            Nosotros
            <svg viewBox="0 0 24 24" style="transform:scaleX(-1);"><path d="M3 12c4-8 14-8 18 0" stroke-linecap="round"/></svg>
          </p>
          <div class="memory-card__img-wrap">
            <img src="img/nosotros-portada.png" alt="Nosotros" />
          </div>
        </a>

        <!-- Tarjeta 2 -->
        <a class="memory-card" href="dama-chiquita.html">
          <p class="memory-card__titulo">
            <svg viewBox="0 0 24 24"><path d="M3 12c4-8 14-8 18 0" stroke-linecap="round"/></svg>
            Dáma chiquita
            <svg viewBox="0 0 24 24" style="transform:scaleX(-1);"><path d="M3 12c4-8 14-8 18 0" stroke-linecap="round"/></svg>
          </p>
          <div class="memory-card__img-wrap">
            <img src="img/dama-chiquita-portada.png" alt="Dáma chiquita" />
          </div>
        </a>

        <!-- Tarjeta 3 -->
        <a class="memory-card" href="proximamente.html">
          <p class="memory-card__titulo">
            <svg viewBox="0 0 24 24"><path d="M3 12c4-8 14-8 18 0" stroke-linecap="round"/></svg>
            ...
            <svg viewBox="0 0 24 24" style="transform:scaleX(-1);"><path d="M3 12c4-8 14-8 18 0" stroke-linecap="round"/></svg>
          </p>
          <div class="memory-card__img-wrap">
            <img src="img/proximamente-portada.png" alt="Próximamente" />
          </div>
        </a>
      </div>

      <!-- Tarjeta destacada con carrusel -->
      <div class="destacada" id="destacadaHome">
        <button class="flecha-circular flecha-circular--izq" aria-label="Anterior">
          <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
        </button>

        <div class="destacada__img-wrap" id="destacadaMediaWrap">
          <img id="destacadaImg" src="img/destacada/recuerdo-1.jpg" alt="" />
        </div>

        <div class="destacada__texto">
          <h3 id="destacadaTitulo"></h3>
          <div class="mini-divisor"></div>
          <p id="destacadaDesc">Que nuestras manos se unan en un lazo eterno, que nuestras almas sean una, junto al amor sincero.</p>
           <span class="corazon">♡</span>
        </div>

        <button class="flecha-circular flecha-circular--der" aria-label="Siguiente">
          <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" /></svg>
        </button>
      </div>
      <div class="carrusel-puntos" id="destacadaPuntos"></div>

      <!-- Flecha para volver al comienzo -->
      <div class="cta-final">
        <button class="circulo" id="ctaVolverArriba" type="button" aria-label="Volver al inicio">
          <svg viewBox="0 0 24 24"><path d="M12 20V6M6 11l6-6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <p class="footer-firma">- Felices 18 años -</p>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
