<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Próximamente — Feliz Cumpleaños</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="bg-decorations">
    <img class="deco-img sutil flota" style="top:4%; left:2%; width:16%; max-width:110px;" src="assets/deco/ionic_column.png" alt="" />
    <img class="deco-img sutil flota-lenta" style="top:18%; right:2%; width:18%; max-width:130px;" src="assets/deco/laurel_wreath_big.png" alt="" />
    <img class="deco-img sutil flota" style="top:46%; left:2%; width:15%; max-width:100px;" src="assets/deco/hermes_lyre.png" alt="" />
    <img class="deco-img sutil flota-lenta" style="top:62%; right:3%; width:14%; max-width:95px;" src="assets/deco/crossed_arrows.png" alt="" />
    <img class="deco-img sutil flota" style="bottom:4%; left:4%; width:13%; max-width:90px;" src="assets/deco/owl_pedestal_2.png" alt="" />
  </div>

  <header class="page-header">
    <a href="index.html" class="volver">← Volver</a>
    <h1>Próximamente...</h1>
    <p>Con el paso del tiempo, vamos a desbloquear más recuerdos.</p>
  </header>

  <main>
    <!-- Carrusel decorativo (no funcional): mismo estilo visual que los demás,
         pero sin interactividad — muestra un candado como símbolo de "bloqueado". -->
    <div class="carrusel" data-decorativo="true">
      <button class="flecha-circular flecha-circular--izq" aria-label="Carrusel bloqueado" type="button" tabindex="-1" aria-disabled="true">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6" /></svg>
      </button>

      <div class="carrusel-track">
        <div class="carrusel-slide activa">
          <svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" style="width:100%; height:100%; display:block;">
            <rect width="400" height="300" fill="#2b2b2b" />
            <g transform="translate(200,150)">
              <path d="M -32 -12 v -28 a 32 32 0 0 1 64 0 v 28" fill="none" stroke="#CACACA" stroke-width="11" stroke-linecap="round" />
              <rect x="-48" y="-14" width="96" height="76" rx="12" fill="#CACACA" />
              <circle cx="0" cy="16" r="9" fill="#2b2b2b" />
              <rect x="-4.5" y="16" width="9" height="20" rx="3" fill="#2b2b2b" />
            </g>
          </svg>
        </div>
      </div>

      <button class="flecha-circular flecha-circular--der" aria-label="Carrusel bloqueado" type="button" tabindex="-1" aria-disabled="true">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6" /></svg>
      </button>

      <p class="carrusel-caption">Bloqueado temporalmente</p>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
